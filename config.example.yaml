# Kopieer dit bestand naar config.yaml en pas de waarden aan.
# ZET NOOIT je echte private key hier in git / deel dit bestand nooit met anderen.

wallet:
  # Beter: laat dit leeg en zet SOLANA_PRIVATE_KEY in een .env bestand (zie .env.example)
  private_key_env_var: "SOLANA_PRIVATE_KEY"

rpc:
  http_url: "https://api.mainnet-beta.solana.com"   # gebruik bij voorkeur een betaalde RPC (Helius/QuickNode) voor snelheid
  ws_url: "wss://api.mainnet-beta.solana.com"

pumpportal:
  # https://pumpportal.fun/ - community trading API voor pump.fun
  ws_url: "wss://pumpportal.fun/api/data"
  trade_api_url: "https://pumpportal.fun/api/trade-local"
  api_key_env_var: "PUMPPORTAL_API_KEY"   # alleen nodig voor de Lightning API variant

# ALGEMENE VEILIGHEID - deze limieten gelden voor ALLE strategieën
risk:
  dry_run: true                 # true = geen echte orders, alleen loggen. Zet zelf bewust op false.
  max_sol_per_trade: 0.05       # max SOL per enkele trade
  max_sol_total_exposure: 0.3   # max totaal aan open posities tegelijk
  max_trades_per_hour: 10
  max_daily_loss_sol: 0.2       # bot stopt zichzelf als dit verlies bereikt is
  default_slippage_pct: 10
  min_liquidity_sol: 5          # negeer tokens met minder liquiditeit dan dit
  max_open_positions: 1000      # bot koopt niets nieuws zolang dit aantal posities al open staat
  # hard kill-switch (niet hetzelfde als max_daily_loss_sol): stopt de HELE
  # bot zodra de echte wallet-balans (SOL omgerekend naar USD via een live
  # koers) hieronder zakt. 0 = uitgeschakeld (standaard).
  min_wallet_balance_usd: 0
  # tweede hard kill-switch, ander criterium dan hierboven: stopt de bot
  # zodra het ECHTE verlies deze sessie (echte wallet-balans, niet het
  # fee-model) dit bedrag bereikt. 0 = uitgeschakeld (standaard).
  max_real_loss_usd: 0

strategies:
  sniper:
    enabled: false
    # simpele filters om de ergste scams/rugpulls te vermijden (geen garantie!)
    min_token_age_seconds: 0
    max_token_age_seconds: 15
    # LET OP: dit filtert op velden (twitter/telegram/website) die niet in
    # het launch-event zitten - pump.fun levert die alleen via de losse
    # metadata-JSON (het uri-veld), dus dit staat altijd op "geen socials"
    # en zet je nu op true, koopt de sniper dus NOOIT meer iets. Gebruik
    # social_watch hieronder als je echt op socials wilt filteren.
    require_socials: false
    take_profit_pct: 50
    stop_loss_pct: 25
    trailing_activation_pct: 20  # arm the trailing stop once up this much from entry
    trailing_stop_pct: 15        # exit if price falls this much from its peak since entry

  social_watch:
    # Wacht op socials in plaats van direct te kopen bij launch (zoals
    # sniper doet) - kijkt watch_window_sec lang naar elke nieuwe token,
    # pollt de metadata elke poll_interval_sec, en koopt zodra er socials
    # verschijnen. Trager dan sniper (per ontwerp), maar filtert op een
    # signaal dat echt bestaat. Gebruikt dezelfde risk-limieten als sniper.
    enabled: false
    watch_window_sec: 60
    poll_interval_sec: 10
    take_profit_pct: 50
    stop_loss_pct: 25
    trailing_activation_pct: 20
    trailing_stop_pct: 15
    # 0 = geen filter. Alleen de auto-tuner verhoogt dit (alleen strenger,
    # nooit losser, en pas als er genoeg data is), zie
    # pumpfun_bot/holder_count_tuning.py - niet handmatig zetten zonder bewijs
    min_holder_count: 0
    # user-requested: skip candidates below this USD market cap - thin/tiny
    # market caps correlated with the worst stop-loss overshoots in live
    # testing (a single sell can crater an illiquid curve 30-50% in one
    # trade tick). 0 = geen filter.
    min_market_cap_usd: 0
    # user-requested: eigen positie-budget, los van de gedeelde
    # risk.max_open_positions pool - alleen live gehandhaafd, dry_run slaat
    # deze check helemaal over om zoveel mogelijk outcome-data te farmen.
    max_open_positions: 5
    # eigen trade-grootte, los van de gedeelde risk.max_sol_per_trade - 0 = gebruik die gedeelde waarde
    trade_size_sol: 0

  birdeye_movers:
    # Ontdekt al bestaande tokens met een echte volume/prijs-spike via
    # Birdeye's trending API - social_watch ziet alleen gloednieuwe
    # launches (subscribeNewToken), dit dekt dat gat. Vereist een gratis
    # account + API key op birdeye.so, zie .env.example (BIRDEYE_API_KEY).
    enabled: false
    api_key_env_var: "BIRDEYE_API_KEY"
    # Birdeye's gratis tier is ~1000 calls/maand (30.000 CU, 30 CU/call) -
    # deze cadans (45 min) blijft daar ruim binnen, ook 24/7 draaiend. NIET
    # verlagen zonder eerst de Birdeye pricing-pagina te checken.
    poll_interval_sec: 2700
    trending_limit: 20
    take_profit_pct: 50
    stop_loss_pct: 25
    trailing_activation_pct: 20
    trailing_stop_pct: 15
    # user-requested: gelijk aan social_watch's eigen waarden - hetzelfde
    # bundled/rug-vormige distributierisico geldt ook voor bestaande tokens,
    # niet alleen gloednieuwe launches
    min_holder_count: 1
    max_top10_concentration_pct: 90
    # user-requested: eigen positie-budget, zie social_watch hierboven
    max_open_positions: 5
    # bevestigd live: kandidaten ruim boven pump.fun's echte bonding-curve
    # graduatie-cap (~$69k) falen om te kopen (400 Bad Request - al
    # gemigreerd naar een echte DEX). Zie BirdeyeMoversConfig's docstring
    # in config.py voor de volledige onderbouwing.
    max_market_cap_usd: 100000
    # eigen trade-grootte, los van de gedeelde risk.max_sol_per_trade - 0 = gebruik die gedeelde waarde
    trade_size_sol: 0

  coingecko_movers:
    # Zelfde niche als birdeye_movers hierboven (al bestaande tokens die
    # plotseling bewegen), maar via CoinGecko's gratis Demo API plan -
    # veel hoger call-budget (10.000/maand vs Birdeye's ~1.000) waardoor dit
    # veel vaker kan pollen en op een echt kort momentum-venster kan
    # reageren. Vereist een gratis CoinGecko account + Demo API key, zie
    # .env.example (COINGECKO_API_KEY). Gebruikt dezelfde is_pump_fun_mint()
    # filter als birdeye_movers - zie coingecko_movers.py.
    enabled: false
    api_key_env_var: "COINGECKO_API_KEY"
    # CoinGecko's gratis Demo plan is 100 calls/min, 10.000 calls/maand -
    # 300s (5 min) is 8.640 calls/maand 24/7, ruim binnen dat budget. NIET
    # verlagen zonder eerst het echte verbruik op het CoinGecko dashboard
    # te checken.
    poll_interval_sec: 300
    trending_limit: 20
    # welk van CoinGecko's price_change_percentage vensters (m5/m15/m30/h1/
    # h6/h24) de buy-beslissing bepaalt - standaard het kortste beschikbare
    momentum_window: "m5"
    min_holder_count: 1
    max_top10_concentration_pct: 90
    max_market_cap_usd: 100000
    take_profit_pct: 50
    stop_loss_pct: 25
    trailing_activation_pct: 20
    trailing_stop_pct: 15
    max_open_positions: 5
    trade_size_sol: 0

  copytrade:
    enabled: false
    watched_wallets:
      - "VUL_HIER_EEN_WALLET_ADRES_IN"
    mirror_pct: 100             # % van de trade-grootte van de gevolgde wallet die je zelf ook doet
    max_copy_delay_ms: 3000     # negeer signalen die ouder zijn dan dit
    max_trade_sol: 0            # eigen cap, onafhankelijk van risk.max_sol_per_trade - 0 = gebruik die gedeelde waarde

  market_maker:
    enabled: false
    target_tokens:
      - "VUL_HIER_EEN_TOKEN_MINT_ADRES_IN"
    grid_levels: 5
    grid_spacing_pct: 2
    order_size_sol: 0.01

dashboard:
  enabled: true
  port: 8765          # open http://localhost:8765 in je browser terwijl de bot draait

alerts:
  console: true
  telegram:
    enabled: false
    bot_token_env_var: "TELEGRAM_BOT_TOKEN"
    chat_id: ""
